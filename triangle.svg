<svg width="400" height="350" viewBox="0 0 400 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">頂角 30°、底角 75° 的等腰三角形</title>
  <desc id="d">底邊為 60(2 − √3),兩腰各為 30(√6 − √2),底邊上的高為 30。</desc>
  <style>
    text { font: 600 15px -apple-system, "SF Pro Text", system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .mark { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- 無背景(透明) -->

  <!-- 依真實比例:高 230,半底 = 230·tan15° ≈ 61.63 -->
  <polygon points="200,50 138.37,280 261.63,280" fill="#f0f6fc" stroke="#0969da" stroke-width="3" stroke-linejoin="round"/>

  <!-- 底邊上的高 + 直角記號 -->
  <line x1="200" y1="50" x2="200" y2="280" class="mark" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M190 280 V270 H200" class="mark" stroke="#57606a" stroke-width="1.5"/>

  <!-- 角度弧 -->
  <path d="M188.6 92.5 A44 44 0 0 0 211.4 92.5" class="mark" stroke="#cf222e" stroke-width="1.5"/>
  <path d="M168.37 280 A30 30 0 0 0 146.13 251.02" class="mark" stroke="#cf222e" stroke-width="1.5"/>
  <path d="M231.63 280 A30 30 0 0 1 253.87 251.02" class="mark" stroke="#cf222e" stroke-width="1.5"/>

  <!-- 角度標示 -->
  <text x="200" y="122" text-anchor="middle" fill="#cf222e">30°</text>
  <text x="179.6" y="248.3" dy=".35em" text-anchor="middle" fill="#1f2328">75°</text>
  <text x="220.4" y="248.3" dy=".35em" text-anchor="middle" fill="#1f2328">75°</text>

  <!-- 高 = 30 -->
  <text x="208" y="190" dy=".35em" fill="#57606a">30</text>

  <!-- 邊長標示 -->
  <text transform="translate(160.5 162.7) rotate(-75)" text-anchor="middle" fill="#0969da">30(√6 − √2)</text>
  <text transform="translate(239.5 162.7) rotate(75)" text-anchor="middle" fill="#0969da">30(√6 − √2)</text>
  <text x="200" y="306" text-anchor="middle" fill="#0969da">60(2 − √3)</text>
</svg>